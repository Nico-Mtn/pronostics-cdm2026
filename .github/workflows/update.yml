name: Mise à jour quotidienne des pronostics

on:
  workflow_dispatch:        # déclenché par le Cron Trigger Cloudflare (API) + manuel
  # NB : le cron GitHub (schedule) a été RETIRÉ car peu fiable (runs nocturnes
  # régulièrement ignorés). C'est désormais le Cron Trigger Cloudflare qui appelle
  # ce workflow via l'API (workflow_dispatch), toutes les 2 h.
  # Pas de trigger `push` : le job committe index.html (champ `maj` changeant) ;
  # un push relancerait le workflow en boucle. Garde-fou : commits en [skip ci].

permissions:
  contents: write           # pour committer results_manual.json mis à jour
  pages: write              # pour déployer sur GitHub Pages
  id-token: write

# Un seul passage Pages à la fois. cancel-in-progress:false = on n'interrompt pas
# un déploiement déjà lancé. Le timeout du job `deploy` (ci-dessous) évite qu'un
# déploiement engorgé fasse traîner le run : il échoue vite au lieu de bloquer la file.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1) BUILD : génère la page, DÉTECTE un vrai changement de contenu, committe et
  # prépare l'artefact Pages UNIQUEMENT si le contenu a changé.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Générer la page (fetch scores + pronostics)
        env:
          FOOTBALLDATA_KEY: ${{ secrets.FOOTBALLDATA_KEY }}
        run: python update.py

      # Déploiement conditionnel : update.py écrit content.sig = empreinte du CONTENU
      # HORS timestamp "maj". Si cette empreinte est identique à celle déjà committée,
      # rien de réel n'a changé (juste l'heure) → on ne redéploie PAS. Ça évite les
      # déploiements Pages « à vide » quand le Worker déclenche sans nouveau résultat.
      - name: Détecter un vrai changement de contenu
        id: detect
        run: |
          if [ -n "$(git status --porcelain -- content.sig)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Contenu modifié → déploiement."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement de contenu (seul l'horodatage a bougé) → pas de déploiement."
          fi

      - name: Committer les résultats récupérés (si contenu modifié)
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results_manual.json data/ko_pronos.json index.html data.json app.version content.sig
          git diff --staged --quiet || git commit -m "MAJ auto $(date -u +%Y-%m-%d) [skip ci]"
          git push || echo "Rien à pousser"

      - name: Configurer Pages
        if: steps.detect.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact (page = racine du dépôt)
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  # 2) DEPLOY : job dédié, rattaché explicitement à l'environnement github-pages
  # (modèle officiel GitHub Pages). Ne s'exécute QUE si le build a détecté un
  # changement de contenu (sinon skip = run vert, zéro déploiement Pages).
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
