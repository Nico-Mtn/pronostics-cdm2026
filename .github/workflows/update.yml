name: Mise à jour quotidienne des pronostics

on:
  schedule:
    # Cron en UTC. Mise a jour toutes les 2 heures (minute 12 pour eviter le pic
    # de charge GitHub a l'heure pile). 12 executions/jour, ~2 appels API chacune.
    - cron: "12 */2 * * *"
  workflow_dispatch:        # permet de lancer manuellement depuis l'onglet Actions
  # NB : pas de trigger `push`. Le job committe lui-même index.html (dont le champ
  # `maj` change a chaque run) ; un trigger push relancerait le workflow en boucle.
  # Les commits du bot portent [skip ci] en garde-fou supplementaire.

permissions:
  contents: write           # pour committer results_manual.json mis à jour
  pages: write              # pour déployer sur GitHub Pages
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Générer la page (fetch scores + pronostics)
        env:
          FOOTBALLDATA_KEY: ${{ secrets.FOOTBALLDATA_KEY }}
        run: python update.py

      - name: Committer les résultats récupérés (si modifiés)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results_manual.json index.html
          git diff --staged --quiet || git commit -m "MAJ auto $(date -u +%Y-%m-%d) [skip ci]"
          git push || echo "Rien à pousser"

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact (page = racine du dépôt)
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
