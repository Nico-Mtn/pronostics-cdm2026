name: Mise à jour quotidienne des pronostics

on:
  workflow_dispatch:        # déclenché par le Cron Trigger Cloudflare (API) + manuel
  # NB : le cron GitHub (schedule) a été RETIRÉ car peu fiable (runs nocturnes
  # régulièrement ignorés). C'est désormais le Cron Trigger Cloudflare qui appelle
  # ce workflow via l'API (workflow_dispatch), toutes les 2 h.
  # Pas de trigger `push` : le job committe index.html (champ `maj` changeant) ;
  # un push relancerait le workflow en boucle. Garde-fou : commits en [skip ci].

permissions:
  contents: write           # pour committer results_manual.json mis à jour
  pages: write              # pour déployer sur GitHub Pages
  id-token: write

# Un seul passage Pages à la fois. cancel-in-progress:false = on n'interrompt pas
# un déploiement déjà lancé. Le timeout du job `deploy` (ci-dessous) évite qu'un
# déploiement engorgé fasse traîner le run : il échoue vite au lieu de bloquer la file.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1) BUILD : génère la page, committe les données, prépare l'artefact Pages.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Générer la page (fetch scores + pronostics)
        env:
          FOOTBALLDATA_KEY: ${{ secrets.FOOTBALLDATA_KEY }}
        run: python update.py

      - name: Committer les résultats récupérés (si modifiés)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results_manual.json index.html data.json
          git diff --staged --quiet || git commit -m "MAJ auto $(date -u +%Y-%m-%d) [skip ci]"
          git push || echo "Rien à pousser"

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact (page = racine du dépôt)
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  # 2) DEPLOY : job dédié, rattaché explicitement à l'environnement github-pages
  # (modèle officiel GitHub Pages). Le timeout borne l'attente si la file s'engorge.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
