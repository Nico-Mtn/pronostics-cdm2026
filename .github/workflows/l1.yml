name: Championnats - mise a jour

on:
  workflow_dispatch:
    inputs:
      archives:
        description: "Regenerer les pages d'archives (saisons passees)"
        type: boolean
        default: false
  schedule:
    - cron: "*/30 11-22 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generer les championnats en cours
        env:
          FOOTBALLDATA_KEY: ${{ secrets.FOOTBALLDATA_KEY }}
        run: python l1.py

      # Une saison archivee est figee : archive.py repart de son cache local et
      # n'appelle l'API que si le cache manque. La page est donc regeneree a chaque
      # run (utile apres un changement de mise en forme) sans consommer de quota.
      # ARCHIVES_FORCE=1 force le rafraichissement depuis l'API.
      - name: Generer les archives (saisons passees)
        env:
          FOOTBALLDATA_KEY: ${{ secrets.FOOTBALLDATA_KEY }}
          ARCHIVES_FORCE: ${{ inputs.archives && '1' || '0' }}
        run: python archive.py

      - name: Generer la page d'accueil
        run: python hub.py

      - name: Detecter un vrai changement de contenu
        id: detect
        run: |
          if [ -n "$(git status --porcelain -- ligue-1-france premier-league-england ligue-1-france-2025-2026 hub.sig)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Committer les donnees (si contenu modifie)
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in ligue-1-france premier-league-england ligue-1-france-2025-2026 \
                   index.html hub.sig \
                   data/l1_pronos.json data/l1_cache.json data/l1_elo_start.json \
                   data/pl_pronos.json data/pl_cache.json data/pl_elo_start.json \
                   data/archive_ligue-1-france-2025-2026.json; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Championnats - MAJ auto $(date -u +%Y-%m-%d) [skip ci]"
          git push || echo "Rien a pousser"

      - name: Configurer Pages
        if: steps.detect.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Preparer l'artefact (site = racine du depot)
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
