# Pronostix — notification matinale (résultats de la veille + justesse)
# ⚠️ À DÉPLACER dans .github/workflows/ APRÈS avoir configuré les secrets
# (voir NOTIFICATIONS.md). Tant qu'il n'y est pas, il ne s'exécute pas.
name: Notification matinale Pronostix

on:
  workflow_dispatch:        # déclenché par le Cron Trigger Cloudflare (API) + manuel
  # NB : le cron GitHub (schedule) a été RETIRÉ car peu fiable (le run de 06:00 UTC
  # était régulièrement ignoré → aucune notif certains matins). C'est désormais le
  # Cron Trigger Cloudflare ("5 6 * * *", soit 08h05 Paris l'été) qui appelle ce
  # workflow via l'API, 5 min après la mise à jour de 06:00 (data.json frais).

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer web-push
        working-directory: notify
        run: npm install web-push --no-save
      - name: Envoyer les notifications
        working-directory: notify
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SUBS_URL: ${{ secrets.SUBS_URL }}
          LIST_SECRET: ${{ secrets.PUSH_LIST_SECRET }}
        run: node send.mjs
