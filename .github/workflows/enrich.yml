name: Enrichissement API-Football

on:
  workflow_dispatch:        # MANUEL UNIQUEMENT.
  # NB (30/06/2026) : le plan gratuit API-Football NE COUVRE PAS la saison 2026
  # ("Free plans do not have access to this season, try from 2022 to 2024").
  # Le cron automatique est donc DÉSACTIVÉ tant qu'une clé Pro (saison courante) n'est pas
  # fournie. Réactiver le bloc `schedule` ci-dessous le cas échéant.
  # schedule:
  #   - cron: "20 5,13,21 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  enrich-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Enrichir via API-Football (lieu, t.a.b., blessés)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python enrich_apifootball.py

      - name: Régénérer la page (intègre l'enrichissement)
        env:
          FOOTBALLDATA_KEY: ${{ secrets.FOOTBALLDATA_KEY }}
        run: python update.py

      - name: Committer données + page (si modifiées)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Enrichissement API-Football $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          git push || echo "Rien à pousser"

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
