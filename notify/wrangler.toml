name = "pronobot-push"
main = "worker.js"
compatibility_date = "2024-11-01"

# Remplace l'id par celui de ton namespace KV (créé avec : wrangler kv namespace create SUBS)
[[kv_namespaces]]
binding = "SUBS"
id = "REMPLACER_PAR_TON_KV_ID"

# Secrets (ne se mettent PAS ici) :
#   wrangler secret put LIST_SECRET     # protège /list et /remove
#   wrangler secret put GH_TOKEN        # PAT GitHub fine-grained (Actions: read/write)

# Cron Triggers Cloudflare (fiables) — pilotent les workflows GitHub via l'API.
#   "0 */2 * * *" → mise à jour page (update.yml), toutes les 2 h
#   "5 6 * * *"   → notification matinale 08h05 Paris l'été (notify.yml)
[triggers]
crons = ["0 */2 * * *", "5 6 * * *"]
