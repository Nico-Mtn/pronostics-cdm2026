<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronostics IA — Coupe du Monde 2026</title>
<meta name="description" content="Pronostics IA de la Coupe du Monde 2026, mis a jour chaque jour avec les vrais scores et la dynamique des equipes.">
<link rel="preconnect" href="https://flagcdn.com">
<style>
  :root{
    --bg:#f4f6fb; --bg2:#ffffff; --card:#ffffff; --card2:#ffffff;
    --line:#e3e8f0; --line2:#eef1f6;
    --txt:#1a2540; --txt2:#475069; --mut:#8a94a8; --dim:#aab2c4;
    --accent:#1746a2; --accent2:#2e6fd6;
    --gold:#c8961e; --goldbg:#fdf6e3;
    --win:#1b7a3d; --winbg:#e6f4ea; --draw:#9a6a00; --drawbg:#fbf2da;
    --rate:#c0392b; --ratebg:#fbe6e3; --real:#e9f1fb;
    --shadow:0 1px 3px rgba(20,40,80,.06),0 6px 22px rgba(20,40,80,.05);
    --confbar:#d4dae6;
    --red:#e23b3b; --orange:#e8902a; --green:#27a35a;
  }
  [data-theme="dark"]{
    --bg:#0b1018; --bg2:#0f1625; --card:#0f1625; --card2:#0d1421;
    --line:#1a2540; --line2:#141d30;
    --txt:#e4e9f2; --txt2:#aab4c8; --mut:#6a7588; --dim:#444f64;
    --accent:#5a8fe0; --accent2:#7aa8e8;
    --gold:#f0c040; --goldbg:#241d0c;
    --win:#5fd47a; --winbg:#142a18; --draw:#f0c040; --drawbg:#2a2310;
    --rate:#e0746a; --ratebg:#2a1614; --real:#13233a;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.25);
    --confbar:#2a3550;
    --red:#ef5350; --orange:#f0a030; --green:#4fc97a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
    transition:background .25s,color .25s}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 52px}
  img.flag{width:24px;height:18px;object-fit:cover;border-radius:3px;flex-shrink:0;
    box-shadow:0 0 0 1px rgba(0,0,0,.08);vertical-align:middle}
  img.flag.sm{width:20px;height:15px}
  header{position:sticky;top:0;z-index:50;background:var(--bg2);
    border-bottom:1px solid var(--line);padding:15px 16px 13px;margin:0 -16px 18px}
  .hrow{display:flex;align-items:center;gap:13px;max-width:760px;margin:0 auto}
  .logo{display:flex;align-items:center;justify-content:center;width:48px;height:48px;flex-shrink:0}
  .logo svg{width:48px;height:48px}
  h1{font-size:16px;font-weight:800;color:var(--txt);margin:0;letter-spacing:.2px;line-height:1.25}
  .sub{font-size:9px;color:var(--mut);letter-spacing:1.3px;margin:3px 0 0;text-transform:uppercase}
  .htools{margin-left:auto;display:flex;align-items:center;gap:10px}
  .pct-box{text-align:right}
  .pct-box .big{font-size:21px;font-weight:800;color:var(--gold);line-height:1}
  .pct-box .lbl{font-size:8px;color:var(--mut);letter-spacing:1px}
  .theme-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card);
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--txt2);transition:.15s}
  .theme-btn:hover{border-color:var(--accent2)}
  .scorebar{display:flex;gap:8px;max-width:760px;margin:12px auto 0}
  .pill{flex:1;text-align:center;padding:8px 4px;border-radius:11px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
  .pill .v{font-size:17px;font-weight:800}
  .pill .t{font-size:8px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
  .pill.exact .v{color:var(--win)}.pill.bon .v{color:var(--gold)}.pill.rate .v{color:var(--rate)}.pill.j .v{color:var(--accent2)}
  .maj{font-size:10px;color:var(--mut);text-align:center;margin:10px auto 0;max-width:760px}
  nav{display:flex;gap:7px;margin:18px 0}
  nav button{flex:1;padding:10px 4px;border:1px solid var(--line);border-radius:11px;background:var(--card);
    color:var(--mut);font-weight:700;font-size:11px;cursor:pointer;letter-spacing:.3px;transition:.15s;font-family:inherit}
  nav button:hover{border-color:var(--accent2);color:var(--txt2)}
  nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grpsel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .grpsel button{width:38px;height:38px;border:2px solid transparent;border-radius:10px;background:var(--card);color:#fff;
    font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;opacity:.55}
  .grpsel button:hover{opacity:.85}
  .grpsel button.on{opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .card{background:var(--card2);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
  /* MATCH */
  .match{padding:14px 16px;border-bottom:1px solid var(--line2);display:flex;gap:13px;align-items:stretch}
  .match:last-child{border-bottom:none}
  .match.is-today{background:linear-gradient(90deg,var(--goldbg),transparent 60%)}
  .conf-circle{flex-shrink:0;width:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .ring{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
  .ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg)}
  .ring .pctn{font-size:11px;font-weight:800}
  .conf-circle .cl{font-size:7px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .match-main{flex:1;min-width:0}
  .match-row1{display:flex;align-items:center;gap:8px}
  .match-row1 .dt{font-size:9px;color:var(--mut);min-width:70px;flex-shrink:0;font-weight:600;line-height:1.3}
  .match-row1 .dt .h{display:block;color:var(--txt2);font-size:10px;font-weight:700}
  .tm{flex:1;font-size:12.5px;color:var(--txt);font-weight:600;display:flex;align-items:center;gap:5px;min-width:0}
  .tm.r{justify-content:flex-end;text-align:right}
  .tm.l{justify-content:flex-start}
  .tm span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .host{font-size:11px;flex-shrink:0;cursor:help}
  .sc{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px}
  .sc .score{font-size:16px;font-weight:800;color:var(--txt);letter-spacing:1px}
  .sc .score.prono{color:var(--gold)}
  .sc .tag{font-size:8px;padding:2px 8px;border-radius:20px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
  .tag.exact{background:var(--winbg);color:var(--win)}.tag.bon{background:var(--drawbg);color:var(--draw)}
  .tag.rate{background:var(--ratebg);color:var(--rate)}.tag.avenir{background:var(--line2);color:var(--mut)}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .b-today{font-size:8.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    background:var(--gold);color:#3a2b00;padding:2px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}
  .b-grp{font-size:8.5px;font-weight:800;color:#fff;padding:2px 8px;border-radius:20px}
  .meta{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2);display:flex;flex-direction:column;gap:8px}
  .style{display:flex;align-items:flex-start;gap:8px}
  .style .lbl{font-size:9px;color:var(--mut);width:50px;flex-shrink:0;text-transform:uppercase;letter-spacing:.5px;padding-top:1px}
  .style .body{flex:1;font-size:10.5px;color:var(--txt2);line-height:1.4}
  .style .body b{color:var(--txt);font-weight:700}
  .style .note{font-size:9.5px;color:var(--mut);font-style:italic;margin-top:1px}
  .dyn{font-size:9.5px;color:var(--accent2);margin-top:2px}
  .resume-toggle{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--accent2);
    background:none;border:none;cursor:pointer;padding:2px 0;font-family:inherit;letter-spacing:.3px}
  .resume-toggle:hover{text-decoration:underline}
  .resume-bubble{margin-top:6px;background:var(--real);border:1px solid var(--line);border-radius:11px;
    padding:10px 12px;font-size:10.5px;line-height:1.55;color:var(--txt2);position:relative}
  .resume-bubble::before{content:"";position:absolute;top:-5px;left:18px;width:9px;height:9px;
    background:var(--real);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
  /* DEPLIANT anciens matchs */
  .accordion{margin-bottom:16px}
  .acc-head{width:100%;display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--card2);
    border:1px solid var(--line);border-radius:14px;cursor:pointer;font-family:inherit;font-weight:700;
    font-size:12px;color:var(--txt2);box-shadow:var(--shadow)}
  .acc-head:hover{border-color:var(--accent2)}
  .acc-head .chev{margin-left:auto;transition:transform .2s;color:var(--mut)}
  .acc-head.open .chev{transform:rotate(180deg)}
  .acc-head .count{font-size:9px;background:var(--line2);color:var(--mut);padding:2px 8px;border-radius:20px;font-weight:700}
  .feed-day{font-size:10px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:1px;
    margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
  .feed-day::after{content:"";flex:1;height:1px;background:var(--line)}
  /* TABLES */
  table{width:100%;border-collapse:collapse;font-size:11px}
  th{background:var(--line2);color:var(--mut);font-weight:700;padding:8px 4px;text-align:center;font-size:9px;letter-spacing:.5px;text-transform:uppercase}
  td{padding:9px 4px;text-align:center;border-bottom:1px solid var(--line2);color:var(--txt2)}
  tr:last-child td{border-bottom:none}
  td.team{text-align:left;font-weight:600;color:var(--txt);padding-left:11px;display:flex;align-items:center;gap:8px}
  tr.q1 td,tr.q2 td{background:var(--winbg)}
  tr.q3 td{background:var(--goldbg)}
  .grphead{padding:11px 14px;font-weight:800;font-size:13px;color:#fff;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
  .grphead small{font-weight:500;font-size:9px;color:rgba(255,255,255,.8);letter-spacing:0}
  .momrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2)}
  .momrow:last-child{border-bottom:none}
  .momrow .tn{flex:1;font-size:12px;font-weight:600;color:var(--txt);display:flex;gap:7px;align-items:center;min-width:0}
  .momrow .res{font-size:9px;color:var(--mut);font-weight:500}
  .momrow .mv{font-size:13px;font-weight:800;min-width:46px;text-align:right}
  .momrow .ar{font-size:10px;font-weight:700;min-width:82px;text-align:right}
  .up{color:var(--win)}.down{color:var(--rate)}.neu{color:var(--mut)}
  .legend{font-size:9.5px;color:var(--mut);line-height:1.8;padding:14px 6px;text-align:center}
  footer{text-align:center;font-size:9.5px;color:var(--dim);padding:24px 0 0;line-height:1.7}
  footer a{color:var(--accent2);text-decoration:none;font-weight:700}
  .empty{text-align:center;padding:46px 20px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo" id="logo"></div>
    <div>
      <h1>Pronostics IA &mdash; Coupe du Monde 2026</h1>
      <div class="sub">Mise a jour quotidienne &middot; Scores &amp; dynamique</div>
    </div>
    <div class="htools">
      <div class="pct-box"><div class="big" id="pct">&mdash;</div><div class="lbl">Fiabilite</div></div>
      <button class="theme-btn" id="theme" title="Basculer clair / sombre" aria-label="Basculer le theme">&#127769;</button>
    </div>
  </div>
  <div class="scorebar" id="scorebar"></div>
  <div class="maj" id="maj"></div>
</header>

<div class="wrap">
  <nav id="nav">
    <button data-v="feed" class="on">&#128293; Live feed</button>
    <button data-v="matches">&#9917; Matchs</button>
    <button data-v="standings">&#128202; Classements</button>
    <button data-v="momentum">&#128200; Dynamique</button>
  </nav>
  <div id="grpsel" class="grpsel"></div>
  <div id="content"></div>
  <footer>
    Coupe du Monde 2026 &middot; 11 juin &ndash; 19 juillet &middot; Etats-Unis / Canada / Mexique<br>
    Pronostics generes par modele IA &middot; Scores reels via football-data.org &middot; Mise a jour automatique quotidienne<br>
    <span style="display:inline-block;margin-top:6px">Cree par <a href="https://github.com/Nico-Mtn" target="_blank" rel="noopener">Nico-Mtn</a></span>
  </footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const FLAG_BASE = "https://flagcdn.com";
const TAG_LABEL = {exact:"\u2713 Exact", bon:"~ Bon resultat", rate:"\u2717 Rate", avenir:"A venir"};
const GRP_COL = {A:"#E53E3E",B:"#DD6B20",C:"#D69E2E",D:"#38A169",E:"#319795",F:"#3182CE",
                 G:"#6B46C1",H:"#D53F8C",I:"#11998e",J:"#C2410C",K:"#0E7490",L:"#7C3AED"};
let view = "feed";
let activeGrp = "A";
let oldOpen = false;

const LOGO_SVG = '<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">'
  + '<defs><linearGradient id="g" x1="0" y1="0" x2="48" y2="48">'
  + '<stop offset="0" stop-color="#2e6fd6"/><stop offset="1" stop-color="#1746a2"/></linearGradient></defs>'
  + '<circle cx="24" cy="24" r="22" fill="url(#g)"/>'
  + '<path d="M24 10l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45L24 28.85l-5.8 3.05 1.1-6.45-4.7-4.6 6.5-.95z" fill="#fff" opacity=".95"/>'
  + '<circle cx="24" cy="36" r="3.2" fill="#f0c040"/></svg>';

function flagImg(code, cls){
  if(!code) return "\uD83C\uDFF3\uFE0F";
  return '<img class="flag'+(cls?' '+cls:'')+'" loading="lazy" src="'+FLAG_BASE+'/w40/'+code+'.png" '
       + 'srcset="'+FLAG_BASE+'/w80/'+code+'.png 2x" alt="">';
}

// Couleur de confiance : <35 rouge, 35-70 orange, >70 vert
function confColor(p){ return p<35?"var(--red)":(p<=70?"var(--orange)":"var(--green)"); }

function confRing(p){
  var col=confColor(p);
  var r=18, c=2*Math.PI*r, off=c*(1-p/100);
  return '<div class="conf-circle"><div class="ring">'
    + '<svg width="44" height="44" viewBox="0 0 44 44">'
    + '<circle cx="22" cy="22" r="'+r+'" fill="none" stroke="var(--confbar)" stroke-width="4"/>'
    + '<circle cx="22" cy="22" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="4" '
    + 'stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'
    + '<span class="pctn" style="color:'+col+'">'+p+'%</span></div>'
    + '<span class="cl">Confiance</span></div>';
}

function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("theme").innerHTML = (t==="dark" ? "\u2600\uFE0F" : "\uD83C\uDF19");
  try{ localStorage.setItem("cdm_theme", t); }catch(e){}
}
(function(){ var t="light"; try{ t=localStorage.getItem("cdm_theme")||"light"; }catch(e){} applyTheme(t); })();
document.getElementById("theme").onclick=function(){
  var cur=document.documentElement.getAttribute("data-theme");
  applyTheme(cur==="dark"?"light":"dark");
};

function renderHeader(){
  document.getElementById("logo").innerHTML = LOGO_SVG;
  var s=DATA.stats;
  var graded=s.exact+s.bon+s.rate;
  var pct=graded?Math.round((s.exact+s.bon)/graded*100):0;
  document.getElementById("pct").textContent=graded?pct+"%":"\u2014";
  document.getElementById("maj").textContent="Derniere mise a jour : "+DATA.maj+" \u2014 "+s.joue+"/"+s.total+" matchs joues";
  document.getElementById("scorebar").innerHTML=
    '<div class="pill j"><div class="v">'+s.joue+'</div><div class="t">Joues</div></div>'
   +'<div class="pill exact"><div class="v">'+s.exact+'</div><div class="t">Exacts</div></div>'
   +'<div class="pill bon"><div class="v">'+s.bon+'</div><div class="t">Bons</div></div>'
   +'<div class="pill rate"><div class="v">'+s.rate+'</div><div class="t">Rates</div></div>';
}

function renderGrpSel(show){
  var c=document.getElementById("grpsel");
  if(!show){c.style.display="none";return;}
  c.style.display="flex";
  c.innerHTML="ABCDEFGHIJKL".split("").map(function(g){
    var on=g===activeGrp;
    return '<button data-g="'+g+'" class="'+(on?'on':'')+'" style="background:'+GRP_COL[g]
      +';border-color:'+GRP_COL[g]+'">'+g+'</button>';}).join("");
  Array.prototype.forEach.call(c.querySelectorAll("button"),function(b){
    b.onclick=function(){activeGrp=b.dataset.g;render();};});
}

function hostBadge(){ return '<span class="host" title="Pays-hote de la competition">\uD83C\uDFDF\uFE0F</span>'; }

function matchCard(m){
  var host_h=m.host_h?hostBadge():'';
  var host_a=m.host_a?hostBadge():'';
  var scoreHtml, tagHtml;
  if(m.reel){
    scoreHtml='<div class="score">'+m.reel[0]+' \u2013 '+m.reel[1]+'</div>';
    tagHtml='<div class="tag '+m.statut+'">'+TAG_LABEL[m.statut]+'</div>';
  }else{
    scoreHtml='<div class="score prono">'+m.prono[0]+' \u2013 '+m.prono[1]+'</div>';
    tagHtml='<div class="tag avenir">Pronostic</div>';
  }
  // date + heure
  var dt='<span class="dt">'+m.date+(m.heure?'<span class="h">'+m.heure+'</span>':'')+'</span>';
  // badges
  var badges='<span class="b-grp" style="background:'+GRP_COL[m.grp]+'">Groupe '+m.grp+'</span>';
  if(m.today) badges='<span class="b-today">\u25CF Match du jour</span>'+badges;
  // dynamique
  var dyn="";
  if(!m.reel){
    var notes=[];
    if(m.mom_h>=0.2)notes.push(m.home+" en confiance (+"+m.mom_h+")");
    else if(m.mom_h<=-0.2)notes.push(m.home+" en difficulte ("+m.mom_h+")");
    if(m.mom_a>=0.2)notes.push(m.away+" en confiance (+"+m.mom_a+")");
    else if(m.mom_a<=-0.2)notes.push(m.away+" en difficulte ("+m.mom_a+")");
    if(notes.length)dyn='<div class="dyn">\u21bb '+notes.join(" \u00b7 ")+'</div>';
  }
  // resume
  var resumeHtml="";
  if(m.reel && m.resume){
    var rid="res-"+m.id;
    resumeHtml='<button class="resume-toggle" data-res="'+rid+'">\uD83D\uDCAC Resume du match</button>'
      +'<div class="resume-bubble" id="'+rid+'" style="display:none">'+m.resume+'</div>';
  }
  return '<div class="match'+(m.today?' is-today':'')+'">'
    + confRing(m.confidence)
    + '<div class="match-main">'
    +   '<div class="match-row1">'+dt
    +     '<span class="tm r"><span class="n">'+m.home+'</span> '+host_h+' '+flagImg(m.ch)+'</span>'
    +     '<div class="sc">'+scoreHtml+tagHtml+'</div>'
    +     '<span class="tm l">'+flagImg(m.ca)+' '+host_a+' <span class="n">'+m.away+'</span></span>'
    +   '</div>'
    +   '<div class="badges">'+badges+'</div>'
    +   '<div class="meta">'
    +     '<div class="style"><span class="lbl">Style</span>'
    +       '<span class="body"><b>'+m.style_label+'</b><div class="note">'+m.style_note+'</div></span></div>'
    +     dyn+resumeHtml
    +   '</div>'
    + '</div></div>';
}

function bindResumes(c){
  Array.prototype.forEach.call(c.querySelectorAll(".resume-toggle"),function(btn){
    btn.onclick=function(){
      var b=document.getElementById(btn.dataset.res);
      if(!b)return;
      var open=b.style.display!=="none";
      b.style.display=open?"none":"block";
      btn.innerHTML=(open?"\uD83D\uDCAC Resume du match":"\uD83D\uDCAC Masquer le resume");
    };
  });
}

function render(){
  Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(b){
    b.classList.toggle("on",b.dataset.v===view);});
  var c=document.getElementById("content");

  if(view==="feed"){
    renderGrpSel(false);
    // tri chronologique global
    var sorted=DATA.matches.slice().sort(function(a,b){return a.sort<b.sort?-1:(a.sort>b.sort?1:a.id-b.id);});
    var played=sorted.filter(function(m){return m.reel;});
    var upcoming=sorted.filter(function(m){return !m.reel;});
    var html="";
    // dépliant Anciens matchs (en haut)
    if(played.length){
      html+='<div class="accordion">'
        +'<button class="acc-head'+(oldOpen?' open':'')+'" id="accbtn">'
        +'\uD83D\uDCC1 Anciens matchs <span class="count">'+played.length+'</span>'
        +'<span class="chev">\u25BC</span></button>'
        +'<div id="accbody" style="display:'+(oldOpen?'block':'none')+'">'
        +'<div class="card">'+played.map(matchCard).join("")+'</div></div></div>';
    }
    // matchs à venir, groupés par jour
    if(upcoming.length){
      var lastDay="";
      upcoming.forEach(function(m){
        if(m.date!==lastDay){
          if(lastDay!=="") html+='</div>';
          html+='<div class="feed-day">'+m.date+(m.today?' \u00b7 aujourd\'hui':'')+'</div><div class="card">';
          lastDay=m.date;
        }
        html+=matchCard(m);
      });
      if(lastDay!=="") html+='</div>';
    } else {
      html+='<div class="empty">Tous les matchs de groupe ont ete joues.</div>';
    }
    c.innerHTML=html;
    var ab=document.getElementById("accbtn");
    if(ab) ab.onclick=function(){
      oldOpen=!oldOpen;
      document.getElementById("accbody").style.display=oldOpen?"block":"none";
      ab.classList.toggle("open",oldOpen);
    };
    bindResumes(c);
  }
  else if(view==="matches"){
    renderGrpSel(true);
    var ms=DATA.matches.filter(function(m){return m.grp===activeGrp;});
    c.innerHTML='<div class="card">'+ms.map(matchCard).join("")+'</div>';
    bindResumes(c);
  }
  else if(view==="standings"){
    renderGrpSel(false);
    var html="";
    "ABCDEFGHIJKL".split("").forEach(function(g){
      var rows=DATA.standings[g]||[];
      var nbReels=rows.reduce(function(mx,r){return Math.max(mx,r.reels);},0);
      html+='<div class="card"><div class="grphead" style="background:'+GRP_COL[g]+'">Groupe '+g
        +' <small>('+nbReels+' match(s) reel(s))</small></div><table>'
        +'<tr><th>#</th><th style="text-align:left;padding-left:11px">Equipe</th><th>Pts</th><th>J</th><th>G</th><th>N</th><th>P</th><th>Diff</th></tr>'
        +rows.map(function(r,i){
          var cls=i<2?"q"+(i+1):(i===2?"q3":"");
          var diff=r.BP-r.BC;
          return '<tr class="'+cls+'"><td>'+(i+1)+'</td>'
            +'<td class="team">'+flagImg(r.code,'sm')+' '+r.team+(r.host?' '+hostBadge():'')+'</td>'
            +'<td><b>'+r.Pts+'</b></td><td>'+r.J+'</td><td>'+r.G+'</td><td>'+r.N+'</td><td>'+r.P+'</td>'
            +'<td>'+(diff>=0?'+':'')+diff+'</td></tr>';
        }).join("")+'</table></div>';
    });
    c.innerHTML=html+'<div class="legend">\uD83D\uDFE2 Qualifie direct (1er-2e) \u00b7 \uD83D\uDFE1 3e (repechage possible) \u00b7 \uD83C\uDFDF\uFE0F Pays-hote<br>Resultats reels pour les matchs joues, pronostics ajustes pour les matchs a venir</div>';
  }
  else if(view==="momentum"){
    renderGrpSel(false);
    if(!DATA.momentum.length){
      c.innerHTML='<div class="empty">Aucun match joue pour l\'instant.<br>La dynamique apparaitra des les premiers resultats.</div>';
      return;
    }
    c.innerHTML='<div class="card">'+DATA.momentum.map(function(m){
      var cls=m.mom>=0.2?"up":(m.mom<=-0.2?"down":"neu");
      var lbl=m.mom>=0.2?"En hausse \u2191":(m.mom<=-0.2?"En baisse \u2193":"Neutre \u2192");
      return '<div class="momrow"><span class="tn">'+flagImg(m.code,'sm')+' '+m.team
        +' <span class="res">'+m.detail+'</span></span>'
        +'<span class="mv '+cls+'">'+(m.mom>=0?'+':'')+m.mom+'</span>'
        +'<span class="ar '+cls+'">'+lbl+'</span></div>';
    }).join("")+'</div>'
    +'<div class="legend">Le momentum ajuste la force d\'une equipe pour ses prochains matchs.<br>Calcule a partir des vrais resultats : victoire/defaite, ecart de buts, exploit ou contre-performance.</div>';
  }
}

Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(b){
  b.onclick=function(){view=b.dataset.v;render();};});
renderHeader();
render();
</script>
</body>
</html>
